name: Validate NexusBotanyFactory

on:
  push:
    branches:
      - 'work/nbf-sg00-sg01-validation-*'
  pull_request:
    branches:
      - build

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate source and native bounded generator
        run: npm test
      - name: Validate Vite production bundle
        run: |
          npm run build
          test -s dist/index.html
      - name: Validate actual browser editor shell
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > /tmp/nbf-vite.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true; cat /tmp/nbf-vite.log' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ >/dev/null
          BROWSER="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "$BROWSER" ]]; then echo "No Chromium browser installed"; exit 1; fi
          "$BROWSER" --version
          "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --user-data-dir="$RUNNER_TEMP/nbf-chrome-profile" --virtual-time-budget=12000 \
            --window-size=1440,900 --dump-dom http://127.0.0.1:5173/ \
            > "$RUNNER_TEMP/nbf-browser-dom.html" 2> "$RUNNER_TEMP/nbf-chrome.log"
          grep -q 'Pine Growth Simulation' "$RUNNER_TEMP/nbf-browser-dom.html"
          "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --user-data-dir="$RUNNER_TEMP/nbf-chrome-profile-ss" --virtual-time-budget=12000 \
            --window-size=1440,900 --screenshot="$RUNNER_TEMP/nbf-editor.png" \
            http://127.0.0.1:5173/ >/tmp/nbf-browser-screenshot.txt 2>&1
          test -s "$RUNNER_TEMP/nbf-editor.png"
          echo "Browser shell mounted, DOM marker present, screenshot saved"
      - name: Retain browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nbf-sg01-browser-evidence
          path: |
            ${{ runner.temp }}/nbf-editor.png
            ${{ runner.temp }}/nbf-browser-dom.html
            ${{ runner.temp }}/nbf-chrome.log
          if-no-files-found: warn
      - name: Validate actual HTTP API
        shell: bash
        run: |
          set -euo pipefail
          NEXUS_BOTANY_API_PORT=31337 node src/server/runtime/dev-server.js > /tmp/nbf-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true; cat /tmp/nbf-api.log' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:31337/api/health >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          const base = 'http://127.0.0.1:31337/api'
          const health = await fetch(base + '/health')
          if (!health.ok || !(await health.json()).ok) process.exit(1)
          const partial = await fetch(base + '/build/validate', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ params: { recursion: 3 } }),
          })
          if (partial.status !== 422) throw new Error('Expected 422 for partial params, received ' + partial.status)
          const malformed = await fetch(base + '/build/validate', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: '{',
          })
          if (malformed.status !== 400) throw new Error('Expected 400 for malformed JSON, received ' + malformed.status)
          console.log('Health=200, incomplete=422, malformed=400')
          JS
